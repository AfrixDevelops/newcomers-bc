name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        # Serve from /<repo> unless a custom domain (CNAME) is configured.
        run: |
          if [ -f "public/CNAME" ]; then
            echo "Custom domain found, building at root path"
            npm run build
          else
            export NEXT_PUBLIC_BASE_PATH="/${GITHUB_REPOSITORY#*/}"
            echo "Building with basePath=$NEXT_PUBLIC_BASE_PATH"
            npm run build
          fi

      - name: Add .nojekyll
        # Without this, GitHub Pages strips the _next directory.
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        # Serve from /<repo> unless a custom domain (CNAME) is configured.
        # NEXT_PUBLIC_SITE_URL has to match exactly: it is what canonical
        # links, the sitemap and the social cards resolve against, and a
        # canonical pointing at the wrong host splits the site in two as
        # far as a crawler is concerned.
        run: |
          if [ -f "public/CNAME" ]; then
            export NEXT_PUBLIC_SITE_URL="https://$(tr -d '[:space:]' < public/CNAME)"
            echo "Custom domain found, building at root path"
          else
            export NEXT_PUBLIC_BASE_PATH="/${GITHUB_REPOSITORY#*/}"
            # Pages serves the owner lowercased; the canonical has to match.
            OWNER=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
            export NEXT_PUBLIC_SITE_URL="https://${OWNER}.github.io${NEXT_PUBLIC_BASE_PATH}"
            echo "Building with basePath=$NEXT_PUBLIC_BASE_PATH"
          fi
          echo "Site URL: $NEXT_PUBLIC_SITE_URL"
          npm run build

      - name: Add .nojekyll
        # Without this, GitHub Pages strips the _next directory.
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
